version: '3'

services:
  starface-webapp:
    image: micosa79/starface-webapp:nightly
    build: .
    restart: always
    ports:
      - "8895:8000"
    environment:
      # ── Pflicht-ENV für den ersten Start ─────────────────────
      # ⚠️ BEISPIELWERTE — vor dem ersten Start ersetzen!
      #
      # FERNET_KEY: Schlüssel zum Verschlüsseln der Anlagen-Zugangsdaten.
      #   Erzeugen mit:  python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      #   WICHTIG: Nach dem ersten Start muss der Schlüssel bei jedem
      #   Neustart GLEICH bleiben, sonst sind gespeicherte Daten unlesbar.
      FERNET_KEY: "pTW7pUSdFomvs0xDAf3K1wyhIEEa5OTUsA6On7pXk3g="
      #
      # ADMIN_USERNAME / ADMIN_PASSWORD: Erster Admin-Benutzer.
      #   Wird NUR beim ersten Start (leere Datenbank) angelegt,
      #   danach nicht mehr ausgewertet.
      ADMIN_USERNAME: "admin@example.com"
      ADMIN_PASSWORD: "BeispielPasswort123!"
      # ── InfluxDB-Anbindung (Zeitreihen-Sammler) ─────────────
      # Werte aus .env (siehe .env.example) — NICHT hier committen.
      INFLUXDB_URL: "http://influxdb:8086"
      INFLUXDB_TOKEN: "${INFLUXDB_TOKEN:-}"
      INFLUXDB_ORG: "starface"
      INFLUXDB_BUCKET: "telefonie"
      # ── Grafana-Dashboard-Links (Monitoring-Seite) ──────────
      # Basis-URL fürs Öffnen der Anlagen-Dashboards aus der WebApp.
      # Interner Stack: http://10.0.25.60:8894 — von außen (PWA/iPhone) die NPM-Subdomain.
      GRAFANA_BASE_URL: "${GRAFANA_BASE_URL:-http://10.0.25.60:8894}"
    volumes:
      - ./data:/data
    depends_on:
      - influxdb

  # ── Grafana (Visualisierung für Admins) — Port 8894 ──────────
  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "8894:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - influxdb

  # ── InfluxDB (Zeitreihen-DB, intern — kein Host-Port) ────────
  influxdb:
    image: influxdb:latest
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "admin"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUXDB_ADMIN_PASSWORD:-}"
      DOCKER_INFLUXDB_INIT_ORG: "starface"
      DOCKER_INFLUXDB_INIT_BUCKET: "telefonie"
    volumes:
      - influxdb-data:/var/lib/influxdb2

volumes:
  grafana-data:
  influxdb-data:
