# Grafana-Datasource: InfluxDB (automatisch beim Start provisioniert)
# Token wird aus der Container-ENV interpoliert (in .env gesetzt).
apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: starface
      defaultBucket: telefonie
      tlsAuth: false
    secureJsonData:
      token: ${INFLUXDB_TOKEN}
