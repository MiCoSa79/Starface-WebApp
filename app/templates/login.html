<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#16213e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>STARFACE WebApp — Login</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #1a1a2e; color: #e0e0e0; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { background: #16213e; border-radius: 12px; padding: 40px; width: 100%; max-width: 400px;
                box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h1 { font-size: 24px; margin-bottom: 8px; color: #e94560; text-align: center; }
        p { color: #888; font-size: 14px; margin-bottom: 24px; text-align: center; }
        label { display: block; font-size: 13px; color: #aaa; margin-bottom: 4px; }
        input { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px;
                background: #0f3460; color: #fff; font-size: 16px; margin-bottom: 16px; }
        input:focus { outline: none; border-color: #e94560; }
        button { width: 100%; padding: 14px; background: #e94560; color: #fff; border: none;
                 border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; }
        button:hover { background: #c73e56; }
        button[disabled] { background: #555; cursor: not-allowed; }
        .error { color: #ff6b6b; font-size: 14px; margin-bottom: 16px; text-align: center; min-height: 20px; }
        .logo { text-align: center; margin-bottom: 16px; }
        .logo img { max-height: 48px; width: auto; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo"><img src="/static/icon-192.png" alt="Logo"></div>
        <h1>STARFACE WebApp</h1>
        <p>Anrufblocker — Rufnummernlisten-Verwaltung</p>

        <div class="error" id="loginError"></div>

        <!-- Schritt 1: Benutzername + Passwort -->
        <form id="loginForm">
            <label for="username">Benutzername</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username">

            <label for="password">Passwort</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <button type="submit" id="loginBtn">Anmelden</button>
        </form>

        <!-- Schritt 2: 2FA-Code (nur eingeblendet, wenn aktiviert) -->
        <form id="otpForm" class="hidden">
            <p style="margin-bottom: 16px;">Gib deinen 2FA-Code aus der Authenticator-App ein.</p>
            <label for="otp_code">2FA-Code</label>
            <input type="text" id="otp_code" name="otp_code" maxlength="6" inputmode="numeric"
                   autocomplete="one-time-code" placeholder="6-stellig" required>
            <button type="submit" id="otpBtn">Bestätigen</button>
        </form>
    </div>

    <script>
        let pendingToken = null;

        function showError(msg) {
            document.getElementById('loginError').textContent = msg || '';
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            showError('');
            document.getElementById('loginBtn').disabled = true;
            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await resp.json();
                if (resp.status === 401) {
                    showError(data.message || 'Falsche Zugangsdaten.');
                    document.getElementById('loginBtn').disabled = false;
                    return;
                }
                if (data.status === '2fa_required') {
                    pendingToken = data.pending_token;
                    document.getElementById('loginForm').classList.add('hidden');
                    document.getElementById('otpForm').classList.remove('hidden');
                    document.getElementById('otp_code').focus();
                    document.getElementById('loginBtn').disabled = false;
                    return;
                }
                window.location.href = '/dashboard';
            } catch (err) {
                showError('Verbindungsfehler. Bitte erneut versuchen.');
                document.getElementById('loginBtn').disabled = false;
            }
        });

        document.getElementById('otpForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            showError('');
            document.getElementById('otpBtn').disabled = true;
            try {
                const resp = await fetch('/api/2fa/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        pending_token: pendingToken,
                        code: document.getElementById('otp_code').value
                    })
                });
                const data = await resp.json();
                if (resp.status === 401) {
                    showError(data.message || 'Code ungültig.');
                    document.getElementById('otpBtn').disabled = false;
                    return;
                }
                window.location.href = '/dashboard';
            } catch (err) {
                showError('Verbindungsfehler. Bitte erneut versuchen.');
                document.getElementById('otpBtn').disabled = false;
            }
        });
    </script>
    <script src="/static/pwa.js" defer></script>
</body>
</html>
