<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#16213e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>2FA einrichten — STARFACE WebApp</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <style>
        .sr-only { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #1a1a2e; color: #e0e0e0; min-height: 100vh;
               display: flex; align-items: center; justify-content: center;
               padding: 16px 16px 56px
        }
        @media (max-width: 640px) {
                        body { padding: 12px 12px 56px; }
            .card { padding: 24px 20px; }; }
        .card { background: #16213e; border-radius: 12px; padding: 40px; width: 100%; max-width: 420px;
                box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h1 { font-size: 22px; margin-bottom: 8px; color: #e94560; text-align: center; }
        p { color: #888; font-size: 14px; margin-bottom: 20px; text-align: center; }
        .qr { text-align: center; margin-bottom: 16px; }
        .qr img { border: 4px solid #333; border-radius: 8px; max-width: 100%; height: auto; }
        .key { color: #aaa; font-family: monospace; font-size: 14px; background: #0f3460;
               padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 16px;
               word-break: break-all; }
        input { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px;
                background: #0f3460; color: #fff; font-size: 18px; margin-bottom: 16px;
                text-align: center; letter-spacing: 4px; }
        button { width: 100%; padding: 14px; background: #e94560; color: #fff; border: none;
                 border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; }
        button:hover { background: #c73e56; }
        a.back { display: block; text-align: center; color: #888; text-decoration: none;
                 margin-top: 16px; font-size: 14px; }

        /* Fußzeile — fixiert am unteren Bildschirmrand */
        .footer { position: fixed; bottom: 0; left: 0; right: 0;
                  text-align: center; padding: 8px 16px; color: #555; font-size: 12px;
                  background: #16213e; border-top: 1px solid #222; z-index: 100; }
    
        /* ── Scrollbars an das Dark-Design anpassen (app-weit) ──── */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,.05); border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.20); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.34); }
        ::-webkit-scrollbar-corner { background: transparent; }
        * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }

</style>
</head>
<body>
    <div class="card">
        <h1>2FA für Benutzer #{{ uid }}</h1>
        <p>Scanne den QR-Code mit deinem Authenticator (z. B. Google Authenticator) und gib den 6-stelligen Code ein.</p>

        <div class="qr"><img src="{{ qr_data_uri }}" alt="QR-Code"></div>

        <div class="key">Geheimer Schlüssel: {{ secret }}</div>

        <form method="POST" action="/admin/users/{{ uid }}/totp-confirm">
            <label class="sr-only" for="code">2FA-Code</label>
            <input type="text" name="code" id="code" required maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" style="font-size:16px;">
            <button type="submit">Bestätigen</button>
        </form>

        <a class="back" href="/admin">Zurück zum Admin</a>
    </div>

    <div class="footer">STARFACE WebApp {{ version }}</div>
    <script src="/static/pwa.js" defer></script>
</body>
</html>
