name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine next version
      id: version
      run: |
        LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
        if [ -z "$LAST" ]; then
          NEXT="v0.0.1"
        else
          BASE="${LAST%%-*}"
          BASE="${BASE#v}"
          IFS='.' read -r MAJ MIN PAT <<< "$BASE"
          PAT=$((PAT + 1))
          NEXT="v$MAJ.$MIN.$PAT"
        fi
        echo "next=$NEXT" >> "$GITHUB_OUTPUT"
        echo "Neue Version: $NEXT"

    - name: Build date
      id: date
      run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Create and push Git tag
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git tag "${{ steps.version.outputs.next }}"
        git push "https://x-access-token:${GITHUB_TOKEN}@github.com/MiCoSa79/Starface-WebApp.git" "${{ steps.version.outputs.next }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v5
      with:
        push: true
        build-args: |
          APP_VERSION=${{ steps.version.outputs.next }}
          BUILD_DATE=${{ steps.date.outputs.date }}
        tags: |
          micosa79/starface-webapp:latest
          micosa79/starface-webapp:${{ steps.version.outputs.next }}
          micosa79/starface-webapp:${{ steps.date.outputs.date }}

    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}