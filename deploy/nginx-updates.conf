# nginx-updates.conf — Update-Server module-updates (Starface-WebApp-Stack)
#
# Rollen: statischer Fileserver für Modulpakete (.sfm) + versions.json,
# geschützt durch nginx secure_link (signierte, zeitbegrenzte URLs).
# Eingebunden als /etc/nginx/conf.d/default.conf im nginx:alpine-Image.
#
# ⚠️ <UPDATE_SIGNING_SECRET> ist ein PLATZHALTER — wird vor dem Aufsetzen per
#    envsubst/sed ersetzt (z. B. durch das Testskript oder die Stack-Befehle in
#    Task 4). NIEMALS ein echtes Secret in diese Datei committen.
# ⚠️ $uri ist die normalisierte Request-URI OHNE Query — die WebApp signiert
#    exakt diesen Pfad (path_prefix), Feldreihenfolge:
#    secure_link_md5 "$secure_link_expires$uri <secret>"
#
# Verhalten: ohne Signatur → 403 | abgelaufen → 410 | gültig → 200 (Cache-Control no-store)

limit_req_zone $binary_remote_addr zone=dl:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;

    # ── Modul-Pakete: NUR mit gültiger, zeitlich gültiger Signatur ──────────
    location /modules/ {
        limit_req zone=dl burst=5 nodelay;

        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri <UPDATE_SIGNING_SECRET>";
        if ($secure_link = "") { return 403; }   # fehlende/falsche Signatur
        if ($secure_link = "0") { return 410; }  # abgelaufen

        add_header Cache-Control "no-store";

        # keine versteckten Dateien (.git, .htaccess …)
        location ~ /\. { deny all; }
    }

    # ── versions.json (Manifest): ebenfalls nur signiert ────────────────────
    location = /versions.json {
        limit_req zone=dl burst=5 nodelay;

        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri <UPDATE_SIGNING_SECRET>";
        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }

        add_header Cache-Control "no-store";
    }
}
